name: Create missing release
description: Create a GitHub release for a given tag if the release does not already exist

inputs:
  tag:
    description: The tag to create a release for
    required: true
  github-token:
    description: GitHub token used to authenticate API requests
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ inputs.tag }}',
            });

            console.log(`Release already exists for tag: ${release.data.name}`);
            return;
          } catch (error) {
            if (error.status !== 404) {
              throw error;
            }
          }

          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: `Release ${{ inputs.tag }}`,
            tag_name: '${{ inputs.tag }}',
            draft: false,
            prerelease: false,
            generate_release_notes: true,
          });

          console.log(`Created release for tag: ${release.data.name}`);
