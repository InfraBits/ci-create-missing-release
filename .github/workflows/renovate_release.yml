name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@6fcc7fab2790be7bff8933fc5654cf0e7329f214 # v1.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
